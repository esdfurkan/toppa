name: desktop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build
        # cmd/toppa (Fyne) is excluded: it needs cgo + OpenGL headers, and is
        # built by scripts/package/windows.ps1 on Windows instead.
        run: go build ./internal/... ./cmd/toppasvc ./cmd/toppactl ./cmd/vectorgen

      - name: Vet
        run: go vet ./internal/... ./cmd/toppasvc ./cmd/toppactl ./cmd/vectorgen

      - name: Test
        run: go test -race ./internal/...

      - name: Golden vectors (Step 1 interop milestone)
        run: go test -race -tags vectors ./protocol/...
        continue-on-error: true # enabled when protocol/vectors land
