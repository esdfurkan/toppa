name: release

on:
  push:
    tags: ["v*"]

# Build artifacts for tagged releases. Signing secrets (APK keystore, Windows
# code-signing cert) are repository secrets — unsigned artifacts are fine for
# F-Droid/GitHub distribution until the signing milestone.

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Test
        working-directory: desktop
        run: go test ./...
      - name: Build (windows amd64)
        working-directory: desktop
        run: |
          GOOS=windows GOARCH=amd64 go build -o dist/toppasvc-windows-amd64.exe ./cmd/toppasvc
          GOOS=windows GOARCH=amd64 go build -o dist/toppactl-windows-amd64.exe ./cmd/toppactl
      - uses: actions/upload-artifact@v4
        with:
          name: toppa-desktop
          path: desktop/dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # :app needs the SDK; this job runs once the app module is included in
      # settings.gradle. Until then only the pure-JVM modules build.
      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: toppa-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
